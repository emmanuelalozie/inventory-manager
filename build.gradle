plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

// H2 writes its own file format, and some versions can't open files from older ones, so the version is pinned
// rather than left to Spring Boot. 2.4.240 is the version Boot 4.1 manages. Before changing it, see O-13 in
// docs/REVIEW.md: existing database files and backups may need an export and re-import.
ext['h2.version'] = '2.4.240'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Schema migrations in src/main/resources/db/migration. Since Boot 4 the auto-configuration is its own starter.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// The H2 web console at /h2-console (its own module since Boot 4).
	implementation 'org.springframework.boot:spring-boot-h2console'
	// OpenAPI description at /v3/api-docs and Swagger UI at /swagger-ui.html. 3.1.x is the line for Spring Boot 4.1.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	// Server mode (application-server.properties); the version is managed by Spring Boot.
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Test slices (@WebMvcTest, @DataJpaTest) are separate test starters since Boot 4.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
