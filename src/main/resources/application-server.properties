# Server mode: start with SPRING_PROFILES_ACTIVE=server. Everything in application.properties still applies unless
# it's set again here. Without this profile Inventix runs in local mode: an H2 file in the per-user folder.

# PostgreSQL instead of the H2 file. Set the connection with SPRING_DATASOURCE_URL (a JDBC URL, e.g.
# jdbc:postgresql://db.example.com:5432/inventix), SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
# Flyway builds the schema on the first start, with the same migrations as local mode.
spring.datasource.url=jdbc:postgresql://localhost:5432/inventix
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=inventix
spring.datasource.password=

# No per-user data folder, H2 console or zip backups: the hosted database keeps its own backups.
inventix.data.managed=false
spring.h2.console.enabled=false
inventix.backup.enabled=false
inventix.backup.auto.enabled=false
# Never written to; set because the local default is inside the per-user folder, which doesn't exist here.
inventix.backup.dir=./backups

# A hosted database starts empty and stays that way until real data is added or moved in.
inventix.seed-data=false

# server.address stays 127.0.0.1 (from application.properties) until sign-in exists: see O-2 in docs/REVIEW.md.
