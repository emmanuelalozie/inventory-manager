spring.application.name=inventix
server.port=8080
# Only accept connections from this machine. This replaces authentication:
# Inventix has one user on one machine, so nothing else on the network may reach the API.
server.address=127.0.0.1

# Data folders. inventix.home defaults to a per-user folder (%LOCALAPPDATA%\Inventix on Windows,
# ~/Library/Application Support/Inventix on macOS, ~/.local/share/inventix on Linux) and inventix.data.dir to
# {home}/data, whatever folder the app is started from. Override with INVENTIX_HOME or INVENTIX_DATA_DIR.
# On the first start, a database in the old ./data folder is copied there (the original is left in place).
# See config/DataLocationPostProcessor.
inventix.data.managed=true

# H2 file database; survives restarts
spring.datasource.url=jdbc:h2:file:${inventix.data.dir}/inventix
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Controllers return DTOs built inside the service transaction, so no lazy loading happens during serialization.
spring.jpa.open-in-view=false

# Origins allowed to call /api/** from a browser (CORS), comma-separated. Leave unset for the built-in list:
# the Tauri app (http://tauri.localhost, https://tauri.localhost, tauri://localhost) and the local dev servers on
# ports 1420 and 5500. Setting it replaces that list. Can also be set with INVENTIX_CORS_ALLOWED_ORIGINS.
#inventix.cors.allowed-origins=http://tauri.localhost,https://tauri.localhost,tauri://localhost

# H2 web console at http://localhost:8080/h2-console (JDBC URL: shown in the log as "Database: ...", without the
# .mv.db ending; user: sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Add sample products on the first start, when the database has no products yet
inventix.seed-data=true

# Folder that POST /api/backup writes inventix-backup-<timestamp>.zip files to
inventix.backup.dir=${inventix.home}/backups

# OpenAPI description (/v3/api-docs) and Swagger UI (/swagger-ui.html). On on purpose: the API only listens on
# 127.0.0.1. Setting them explicitly also keeps springdoc from warning at startup.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
