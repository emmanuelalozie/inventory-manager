spring.application.name=inventix
server.port=8080
# Only accept connections from this machine. This replaces authentication:
# Inventix has one user on one machine, so nothing else on the network may reach the API.
server.address=127.0.0.1

# H2 file database in ./data (relative to the folder the app is started from); survives restarts
spring.datasource.url=jdbc:h2:file:./data/inventix
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the entities match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Controllers return DTOs built inside the service transaction, so no lazy loading happens during serialization.
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/inventix, user: sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Add sample products on the first start, when the database has no products yet
inventix.seed-data=true

# Folder that POST /api/backup writes inventix-backup-<timestamp>.zip files to
inventix.backup.dir=./backups
