spring.application.name=inventix
server.port=8080

# In-memory H2 database (data is lost when the app stops)
spring.datasource.url=jdbc:h2:mem:inventix;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Order.orderItems is lazy and is serialized after the service call returns,
# so the session stays open for the whole request.
spring.jpa.open-in-view=true

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:inventix, user: sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Add sample products on startup when the database is empty
inventix.seed-data=true
