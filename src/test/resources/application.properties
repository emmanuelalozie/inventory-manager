# Test configuration. It replaces src/main/resources/application.properties completely,
# so tests never open the file database in ./data.
spring.application.name=inventix

# In-memory H2, shared by every @SpringBootTest context in the run.
# @DataJpaTest swaps in its own embedded database; Flyway runs against that one too.
spring.datasource.url=jdbc:h2:mem:inventix-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Same as production: the migrations build the schema and Hibernate validates it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Exercise DataSeeder in the full-context tests.
inventix.seed-data=true

inventix.backup.dir=./build/test-backups
