[package]
name = "inventix-desktop"
version = "0.1.0"
description = "Inventix desktop client"
authors = ["Inventix contributors"]
edition = "2021"

[lib]
# The "_lib" suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "inventix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
